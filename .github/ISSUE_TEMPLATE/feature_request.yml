name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow or question you want Pulse to handle.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design (optional)
      description: How should this work across the dashboard, REST API, and MCP server?
